name: quyethue-prod

# Chạy trên EC2: clone repo, đứng ở thư mục deploy/, điền .env (xem .env.example), rồi  docker compose up -d --build
# Dữ liệu (database, plugin, theme, ảnh) nằm trong volume. Lần đầu nhập bằng ./nhap-du-lieu.sh.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thiếu DB_ROOT_PASSWORD trong .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    build:
      context: ..
      dockerfile: deploy/image/wordpress/Dockerfile
    image: quyethue-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SITE_URL: ${SITE_URL:?Thiếu SITE_URL trong .env}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
    ports:
      - "${WP_BIND:-127.0.0.1}:${WP_PORT:-8080}:80"
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
